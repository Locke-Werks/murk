name: release

on:
  push:
    tags: ['v*']

env:
  # Pinned: a Forge release cannot change what this job produces. v0.4.1 knows
  # every key installer.toml uses ([[options]], when, path_append).
  FORGE_VERSION: v0.4.1
  QT_VERSION: 6.8.3

jobs:
  windows:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          arch: win64_msvc2022_64
          cache: true

      - name: Build
        shell: pwsh
        run: |
          $env:QMAKE = "$env:QT_ROOT_DIR\bin\qmake.exe"
          cargo build --release -p murk-gui -p murk-tui

      - name: Test
        shell: pwsh
        run: |
          $env:QMAKE = "$env:QT_ROOT_DIR\bin\qmake.exe"
          cargo test --release --workspace

      # Everything under stage/ lands on the user's disk byte for byte.
      - name: Stage payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item target/release/murk-gui.exe, target/release/murk.exe, LICENSE stage/
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations `
            --qmldir crates/murk-gui/qml stage/murk-gui.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

      # Forge extracts payload files verbatim, so they are signed before forging.
      - name: Sign the payload
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: specterpoint
          certificate-profile-name: specterpoint
          files-folder: stage
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Fetch Forge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:FORGE_VERSION --repo Locke-Werks/Forge `
            --pattern '*.exe' --dir tools
          foreach ($name in 'lwforge.exe', 'lwstub.exe') {
            $sig = Get-AuthenticodeSignature "tools/$name"
            "$name : $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "tools/$name is $($sig.Status)" }
          }

      - name: Forge the installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content installer.toml) -replace '^version\s*=.*', "version      = `"$ver`"" |
            Set-Content installer.toml
          ./tools/lwforge.exe build `
            --config installer.toml `
            --payload stage `
            --stub tools/lwstub.exe `
            --out "dist/Murk-$ver-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "lwforge failed" }

      - name: Sign the installer
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: specterpoint
          certificate-profile-name: specterpoint
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $setup
          "installer: $($sig.Status)  $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "installer is $($sig.Status)" }
          ./tools/lwforge.exe inspect $setup
          if ($LASTEXITCODE -ne 0) { throw "the signed installer cannot read its own container" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-dev pkg-config

      - name: Build and test
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          cargo build --release -p murk-gui -p murk-tui
          cargo test --release --workspace

      - name: AppImage
        run: |
          ver="${GITHUB_REF_NAME#v}"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp assets/murk.png AppDir/usr/share/icons/hicolor/512x512/apps/murk.png
          cat > AppDir/usr/share/applications/murk.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Murk
          Comment=IRC client
          Exec=murk-gui
          Icon=murk
          Categories=Network;Chat;IRCClient;
          DESKTOP
          sed -i 's/^ *//' AppDir/usr/share/applications/murk.desktop
          export QMAKE="$QT_ROOT_DIR/bin/qmake" QML_SOURCES_PATHS=crates/murk-gui/qml
          # murk-gui reaches Qt Multimedia only from QML, so the Qt plugin does not
          # see it as a dependency and leaves the playback backend out. Ask for it,
          # and for native Wayland when this Qt has the plugins.
          modules="multimedia"
          if ls "$QT_ROOT_DIR/plugins/platforms/libqwayland-generic.so" > /dev/null 2>&1; then
            modules="$modules;waylandclient"
            export EXTRA_PLATFORM_PLUGINS="libqwayland-generic.so;libqwayland-egl.so"
          fi
          export EXTRA_QT_MODULES="$modules"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable target/release/murk-gui --executable target/release/murk \
            --desktop-file AppDir/usr/share/applications/murk.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/murk.png \
            --plugin qt --output appimage
          # v0.1.0 shipped without a playback backend and nothing noticed. Fail here.
          ls AppDir/usr/plugins/multimedia/*.so
          ls AppDir/usr/plugins/platforms/
          mv Murk*.AppImage "Murk-$ver-x86_64.AppImage"
          cp target/release/murk "murk-$ver-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Murk-*.AppImage
            murk-*-linux-x86_64

  # macOS: built, signed, notarized and stapled here; there is no Mac to test on,
  # so the release notes say it is untested. arm64 only (macos-26 is Apple Silicon).
  macos:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true

      # Ephemeral keychain, destroyed at the end. On a runner login.keychain is
      # locked and there is no GUI to unlock it.
      - name: Import Developer ID certificate
        env:
          P12_B64: ${{ secrets.DEVELOPER_ID_APP_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PW"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PW=$KEYCHAIN_PW" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Without Apple's intermediates codesign fails errSecInternalComponent,
          # which looks like a bad certificate and is not one.
          for ca in AppleWWDRCAG3 DeveloperIDG2CA AppleRootCA-G3; do
            curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN"
          done
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this codesign waits forever on a prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Qt 6.8.3's qyieldcpu.h calls __yield without including <arm_acle.h>, and
      # the Xcode on macos-26 rejects the implicit declaration.
      - name: macOS compiler workaround
        # Qt 6.8.3 also still links Apple's AGL framework, which the macOS 26 SDK
        # no longer has. Murk never uses it; strip it from this runner's Qt.
        run: |
          echo "CXXFLAGS=-include arm_acle.h" >> "$GITHUB_ENV"
          grep -rlI -- '-framework AGL' "$QT_ROOT_DIR/mkspecs" "$QT_ROOT_DIR/lib" 2>/dev/null \
            | while read -r f; do sed -i '' 's/-framework AGL//g' "$f"; done
          ! grep -rqI -- '-framework AGL' "$QT_ROOT_DIR/mkspecs" "$QT_ROOT_DIR/lib"

      - name: Build and test
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          cargo build --release -p murk-gui -p murk-tui
          cargo test --release --workspace

      - name: Bundle
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          app=Murk.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/murk-gui target/release/murk "$app/Contents/MacOS/"
          sed "s/@VERSION@/$ver/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # Icon: every size macOS asks for, from the 512px master.
          set=murk.iconset
          mkdir -p "$set"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/murk.png --out "$set/icon_${s}x${s}.png" > /dev/null
            d=$((s * 2)); [ $d -le 512 ] || d=512
            sips -z $d $d assets/murk.png --out "$set/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns "$set" -o "$app/Contents/Resources/murk.icns"
          "$QT_ROOT_DIR/bin/macdeployqt" "$app" -qmldir=crates/murk-gui/qml -always-overwrite

      # Inside out: every library and plugin, the command-line client, then the
      # app itself with the hardened runtime and the JIT entitlement QML needs.
      # --options runtime and --timestamp are both required for notarization.
      - name: Sign
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          id="Developer ID Application: Joseph Hancuff (KVJL9RB8BY)"
          sign() { codesign --keychain "$KEYCHAIN" -s "$id" --options runtime --timestamp -f "$@"; }
          find Murk.app/Contents/Frameworks Murk.app/Contents/PlugIns Murk.app/Contents/Resources/qml \
            -type f \( -name '*.dylib' -o -perm -u+x \) 2>/dev/null | while read -r f; do
            if file "$f" | grep -q 'Mach-O'; then sign "$f"; fi
          done
          for fw in Murk.app/Contents/Frameworks/*.framework; do sign "$fw"; done
          sign Murk.app/Contents/MacOS/murk
          sign --entitlements packaging/macos/entitlements.plist Murk.app
          codesign --verify --deep --strict --verbose=2 Murk.app

      - name: Notarize, staple and package
        env:
          ASC_KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$RUNNER_TEMP/asc.p8"
          trap 'rm -f "$RUNNER_TEMP/asc.p8"' EXIT
          notarize() {
            xcrun notarytool submit "$1" --key "$RUNNER_TEMP/asc.p8" \
              --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m
          }
          ditto -c -k --sequesterRsrc --keepParent Murk.app "$RUNNER_TEMP/upload.zip"
          notarize "$RUNNER_TEMP/upload.zip"
          xcrun stapler staple Murk.app
          spctl -a -vvv -t exec Murk.app
          dmg="Murk-$ver-macos-arm64.dmg"
          hdiutil create -volname Murk -srcfolder Murk.app -ov -format UDZO "$dmg"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          codesign --keychain "$KEYCHAIN" -s "Developer ID Application: Joseph Hancuff (KVJL9RB8BY)" --timestamp -f "$dmg"
          notarize "$dmg"
          xcrun stapler staple "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Murk-*-macos-arm64.dmg

      - name: Destroy keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Murk ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "The macOS build is signed and notarized but has not been run on a Mac. It is for Apple Silicon only. Reports welcome." \
            out/windows/* out/linux/* out/macos/*
