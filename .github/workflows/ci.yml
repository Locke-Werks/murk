name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand, e.g. when a run is lost to a GitHub outage.
  workflow_dispatch:

env:
  QT_VERSION: 6.8.3

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true
      # Qt 6.8.3's qyieldcpu.h calls __yield without including <arm_acle.h>, and
      # the Xcode on macos-26 rejects the implicit declaration. Pre-including the
      # header is enough; drop this once Qt is moved past the fix.
      - name: macOS compiler workaround
        if: runner.os == 'macOS'
        run: echo "CXXFLAGS=-include arm_acle.h" >> "$GITHUB_ENV"
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libxkbcommon-x11-0
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        shell: bash
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          cargo test --workspace
