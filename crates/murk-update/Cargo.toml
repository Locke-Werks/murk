[package]
name = "murk-update"
description = "Self-update for Murk: release check, verified download, and per-platform install"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
futures-util = "0.3.34"
# Same feature set as murk-media, so no second TLS stack lands in the binary.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "charset", "http2", "gzip", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["fs", "io-util", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
