[package]
name = "murk-files"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
infer = "0.22.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
