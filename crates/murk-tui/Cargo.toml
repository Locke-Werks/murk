[package]
name = "murk-tui"
description = "Murk terminal client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
murk-client = { version = "0.1.0", path = "../murk-client" }
murk-config = { version = "0.1.0", path = "../murk-config" }
murk-core = { version = "0.1.0", path = "../murk-core" }
murk-proto = { version = "0.1.0", path = "../murk-proto" }
murk-store = { version = "0.1.0", path = "../murk-store" }
ratatui = "0.30.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
unicode-width = "0.2.3"

[[bin]]
name = "murk"
path = "src/main.rs"
