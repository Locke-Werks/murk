[package]
name = "murk-client"
description = "Frontend-independent client state shared by the Murk terminal and desktop clients"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
murk-config = { path = "../murk-config" }
murk-dcc = { path = "../murk-dcc" }
murk-proto = { path = "../murk-proto" }
murk-core = { path = "../murk-core" }
murk-script = { path = "../murk-script" }
murk-store = { path = "../murk-store" }
unicode-width = "0.2.3"
dirs = "7.0.0"
tokio = { version = "1.54.1", features = ["rt"] }
