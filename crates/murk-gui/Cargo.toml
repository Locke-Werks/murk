[package]
name = "murk-gui"
description = "Murk desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "murk-gui"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
murk-client = { version = "0.1.0", path = "../murk-client" }
murk-config = { version = "0.1.0", path = "../murk-config" }
murk-core = { version = "0.1.0", path = "../murk-core" }
murk-media = { version = "0.1.0", path = "../murk-media" }
murk-proto = { version = "0.1.0", path = "../murk-proto" }
murk-store = { version = "0.1.0", path = "../murk-store" }
notify-rust = "4.19.0"
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[build-dependencies]
cxx-qt-build = "0.10.0"
embed-resource = "3.0.12"
