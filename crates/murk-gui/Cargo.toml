[package]
name = "murk-gui"
description = "Murk desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "murk-gui"
path = "src/main.rs"

[dependencies]
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
murk-client = { path = "../murk-client" }
murk-config = { path = "../murk-config" }
murk-core = { path = "../murk-core" }
murk-media = { path = "../murk-media" }
murk-proto = { path = "../murk-proto" }
murk-store = { path = "../murk-store" }
notify-rust = "4.19.0"
png = "0.18.1"
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[build-dependencies]
cxx-qt-build = "0.10.0"
embed-resource = "3.0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Globalization", "Win32_System_Com"] }

[target.'cfg(not(windows))'.dependencies]
spellbook = "0.4.2"
